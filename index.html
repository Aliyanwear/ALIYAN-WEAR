<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALIYAN WEAR | Custom Streetwear</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#050505;
    color:white;
}

.hero{
    min-height:100vh;
    padding:40px 8%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:40px;
}

.glass{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    border-radius:30px;
    padding:40px;
}

h1{
    font-size:70px;
    letter-spacing:3px;
}

h2{
    font-size:35px;
    margin-bottom:20px;
}

p{
    color:#cfcfcf;
    font-size:20px;
    line-height:1.5;
}

.blue{
    color:#1677ff;
}

button{
    margin-top:30px;
    padding:18px 35px;
    border:none;
    border-radius:50px;
    background:#1677ff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.tshirt{
    width:350px;
    height:450px;
    background:white;
    border-radius:40px 40px 80px 80px;
    box-shadow:0 0 80px #1677ff;
}

.features{
    padding:40px 8%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    padding:30px;
}

@media(max-width:900px){
.hero{
    flex-direction:column;
}
h1{
    font-size:45px;
}
.features{
    grid-template-columns:1fr;
}
}
</style>

</head>

<body>

<section class="hero">

<div class="glass">

<h1>
ALIYAN <span class="blue">WEAR</span>
</h1>

<h2>
Создай футболку<br>
со своим дизайном
</h2>

<p>
Premium качество<br>
100% турецкий хлопок<br>
Standard и Oversize<br>
Доставка по России и Тоҷикистон
</p>

<button>
Создать заказ
</button>

</div>


<div class="tshirt"></div>


</section>


<section class="features">

<div class="glass card">
<h2>01</h2>
<p>Premium материалы</p>
</div>

<div class="glass card">
<h2>02</h2>
<p>Свой дизайн</p>
</div>

<div class="glass card">
<h2>03</h2>
<p>Oversize стиль</p>
</div>

<div class="glass card">
<h2>04</h2>
<p>Быстрая доставка</p>
</div>

</section>


</body>
</html>
